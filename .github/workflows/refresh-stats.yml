# Regenerates the GitHub stats snapshot (card, portfolio note, profile README
# source) from live GitHub data. Manual-only (workflow_dispatch from the
# Actions tab) — no schedule: the npm badges and star chart render live, so
# scheduled re-renders just burn Actions minutes.
name: refresh-stats

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Regenerate GitHub stats
        env:
          GH_CMD: gh
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/github-stats.mjs
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/img/github-stats.svg public/markdown/github-stats.md stats-output/profile-README.md
          git diff --cached --quiet || git commit -m "chore: refresh GitHub stats snapshot"
          git push
